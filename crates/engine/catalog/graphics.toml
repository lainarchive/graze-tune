[[tweak]]
id = "nv.low-latency-ultra"
module = "NVIDIA profile"
title = "Low Latency Mode: Ultra"
why = "Just-in-time frame submission. Only helps when GPU-bound; on a CPU-bound i5-7500 benchmark it."
risk = "caution"
changes = [
  { target = { kind = "nvidia", setting = 0x0005F543 }, value = 2, default = 0 },
  { target = { kind = "nvidia", setting = 0x10835000 }, value = 1, default = 0 },
  { target = { kind = "nvidia", setting = 0x007BA09E }, value = 1, default = 0 },
]

[[tweak]]
id = "nv.low-latency-on"
module = "NVIDIA profile"
title = "Low Latency Mode: On"
why = "Caps the render queue at one frame. Cuts input lag with little FPS cost; Ultra goes further but can stutter when CPU-bound."
risk = "safe"
changes = [
  { target = { kind = "nvidia", setting = 0x0005F543 }, value = 1, default = 0 },
  { target = { kind = "nvidia", setting = 0x10835000 }, value = 0, default = 0 },
  { target = { kind = "nvidia", setting = 0x007BA09E }, value = 1, default = 0 },
]

[[tweak]]
id = "nv.vsync-off"
module = "NVIDIA profile"
title = "Vertical sync: force off"
why = "Removes vsync queueing. Pair with G-SYNC and a frame cap if you have VRR."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x00A879CF }, value = 0x08416747, default = 0x60925292 }]

[[tweak]]
id = "nv.power-max"
module = "NVIDIA profile"
title = "Power management: prefer maximum performance"
why = "Stops the GPU dropping clocks between frames, which shows up as frametime spikes."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x1057EB71 }, value = 1, default = 5 }]

[[tweak]]
id = "nv.shader-cache-unlimited"
module = "NVIDIA profile"
title = "Shader cache size: unlimited"
why = "Avoids shader recompiles (and their stutter) when the default cache fills."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x00AC8497 }, value = 0xFFFFFFFF, default = 0x4000 }]

[[tweak]]
id = "nv.texture-performance"
module = "NVIDIA profile"
title = "Texture filtering: high performance"
why = "Small fps gain, slightly blurrier textures at an angle."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x00CE2691 }, value = 0x14, default = 0 }]

[[tweak]]
id = "nv.threaded-opt"
module = "NVIDIA profile"
title = "Threaded optimization: on"
why = "Offloads OpenGL driver work to another thread. Auto is usually right; on for OpenGL games."
risk = "caution"
changes = [{ target = { kind = "nvidia", setting = 0x20C1221E }, value = 1, default = 0 }]

[[tweak]]
id = "nv.highest-refresh"
module = "NVIDIA profile"
title = "Preferred refresh rate: highest available"
why = "Makes fullscreen games use the monitor's highest refresh rate."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x0064B541 }, value = 1, default = 0 }]

[[tweak]]
id = "nvhw.msi"
module = "NVIDIA hardware"
title = "MSI mode on the RTX 3050"
why = "Message-signaled interrupts for the GPU. Same change as in Interrupts & drivers."
risk = "caution"
restart = true
changes = [{ target = { kind = "device_registry", class = "display", subkey = 'Interrupt Management\MessageSignaledInterruptProperties', name = "MSISupported" }, value = 1, default = "not set" }]

[[tweak]]
id = "nvhw.telemetry"
module = "NVIDIA hardware"
title = "Disable NVIDIA telemetry container"
why = "Removes a background service that wakes periodically."
risk = "safe"
changes = [{ target = { kind = "service", name = "NvTelemetryContainer" }, value = 4, default = 2 }]

[[tweak]]
id = "nvhw.hdcp"
module = "NVIDIA hardware"
title = "Disable HDCP"
why = "Removes HDCP handshakes on display mode changes. Breaks protected streaming video."
risk = "caution"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000', name = "RMHdcpKeyglobZero" }, value = 1, default = "not set" }]

[[tweak]]
id = "nvhw.pcie-aspm"
module = "NVIDIA hardware"
title = "PCIe link power management off"
why = "Keeps the GPU's PCIe link at full power so it doesn't retrain between frames."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "SUB_PCIEXPRESS", setting = "ASPM" }, value = 0, default = 1 }]

[[tweak]]
id = "display.hags"
module = "Display path"
title = "Hardware-accelerated GPU scheduling"
why = "Lets the GPU manage its own queue. Required for DLSS frame generation; benchmark on older CPUs."
risk = "caution"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\GraphicsDrivers', name = "HwSchMode" }, value = 2, default = 1 }]

[[tweak]]
id = "display.mpo"
module = "Display path"
title = "Disable multiplane overlay"
why = "MPO causes flicker and stutter on some NVIDIA drivers with mixed monitors."
risk = "caution"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows\Dwm', name = "OverlayTestMode" }, value = 5, default = "not set" }]

[[tweak]]
id = "display.windowed-opt"
module = "Display path"
title = "Optimizations for windowed games"
why = "Uses flip-model presentation for DX10/11 windowed games: lower latency, allows VRR."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\DirectX\UserGpuPreferences', name = "DirectXUserGlobalSettings" }, value = "SwapEffectUpgradeEnable=1;", default = "not set" }]

[[tweak]]
id = "display.fso"
module = "Display path"
title = "Keep fullscreen optimizations on"
why = "Disabling FSO globally is a common placebo tweak; with FSO games get independent flip anyway."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'System\GameConfigStore', name = "GameDVR_FSEBehaviorMode" }, value = 0, default = 0 }]

[[tweak]]
id = "nv.cuda-p2-off"
module = "NVIDIA profile"
title = "CUDA: don't force P2 state"
why = "The driver drops memory clocks to P2 whenever a CUDA app runs (video upscalers, encoders, some overlays). Off lets the card stay at full P0 clocks."
risk = "safe"
changes = [{ target = { kind = "nvidia", setting = 0x50166C5E }, value = 0, default = 1 }]

[[tweak]]
id = "nvhw.dynamic-pstate"
module = "NVIDIA hardware"
title = "Lock the GPU in its top performance state"
why = "Stops the card clocking down between frames, which can cause stutter in light or CPU-bound games. NVIDIA and AMD drivers both read it. Idle power and heat go up."
risk = "caution"
restart = true
changes = [{ target = { kind = "device_registry", class = "display", subkey = "", name = "DisableDynamicPstate" }, value = 1, default = "not set" }]

[[tweak]]
id = "display.tdr-delay"
module = "Display path"
title = "Longer GPU timeout before driver reset"
why = "Windows resets the display driver if the GPU is busy for 2 seconds, which heavy shader compiles can trip. 8 seconds avoids false resets; a real hang takes longer to recover."
risk = "caution"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\GraphicsDrivers', name = "TdrDelay" }, value = 8, default = "not set" }]

[[tweak]]
id = "nvhw.async-pstates"
module = "NVIDIA hardware"
title = "Disable asynchronous P-state changes"
why = "Stops the driver switching memory and core clocks independently mid-frame, which some cards turn into frame-time spikes. Idle power goes up."
risk = "caution"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", name = "DisableASyncPstates" }, value = 1, default = "not set" },
]

[[tweak]]
id = "nv.ansel-off"
module = "NVIDIA profile"
title = "Disable Ansel"
why = "Stops the driver injecting the Ansel photo-mode hooks into supported games. Ansel and its hotkey stop working."
risk = "safe"
changes = [
  { target = { kind = "nvidia", setting = 0x1075543A }, value = 0, default = 1 },
]

[[tweak]]
id = "gpu.amd-ulps"
module = "GPU drivers"
title = "AMD: disable ultra-low power state"
why = "ULPS powers the GPU almost fully down at idle, and waking from it can cause flicker, black screens or a slow first frame. Idle power goes up slightly. Only AMD drivers read this."
risk = "safe"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "EnableULPS" }, value = 0, default = 1 },
]

[[tweak]]
id = "gpu.amd-power-gating"
module = "GPU drivers"
title = "AMD: disable GPU power gating"
why = "Keeps parts of the AMD GPU powered instead of switching them off between loads, which removes wake-up latency. Idle power and heat go up."
risk = "caution"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "DisablePowerGating" }, value = 1, default = "not set" },
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "PP_GPUPowerDownEnabled" }, value = 0, default = "not set" },
]

[[tweak]]
id = "gpu.amd-video-clock-gating"
module = "GPU drivers"
title = "AMD: keep video engines clocked"
why = "Stops the AMD encoder and decoder blocks gating their clocks, which can stutter recording, streaming or video playback while gaming. Idle power goes up."
risk = "caution"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "DisableVCEPowerGating" }, value = 1, default = "not set" },
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "DisableVceClockGating" }, value = 1, default = "not set" },
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "EnableUvdClockGating" }, value = 0, default = "not set" },
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "EnableVceSwClockGating" }, value = 0, default = "not set" },
]

[[tweak]]
id = "gpu.amd-aspm"
module = "GPU drivers"
title = "AMD: no PCIe link power saving"
why = "Turns off the L0s and L1 PCIe power states in the AMD driver so the link never sleeps between frames."
risk = "safe"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "EnableAspmL0s" }, value = 0, default = "not set" },
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "1002", name = "EnableAspmL1" }, value = 0, default = "not set" },
]

[[tweak]]
id = "gpu.intel-adaptive-vsync"
module = "GPU drivers"
title = "Intel: disable adaptive V-Sync"
why = "Intel graphics can switch V-Sync on and off by itself depending on frame rate. Off leaves sync to the game's own setting."
risk = "safe"
restart = true
changes = [
  { target = { kind = "device_registry", class = "display", subkey = "", vendor = "8086", name = "AdaptiveVsyncEnable" }, value = 0, default = "not set" },
]

[[tweak]]
id = "display.adaptive-brightness"
module = "Display path"
title = "No adaptive brightness on AC"
why = "Stops Windows changing screen brightness from the light sensor while plugged in, so the picture doesn't shift mid-game."
risk = "safe"
changes = [
  { target = { kind = "power", subgroup = "SUB_VIDEO", setting = "ADAPTBRIGHT" }, value = 0, default = 1 },
]

[[tweak]]
id = "display.wallpaper-quality"
module = "Display path"
title = "Full-quality wallpaper"
why = "Windows recompresses JPEG wallpapers to 85% quality, which shows as banding on large or high-res monitors. Takes effect the next time a wallpaper is set."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Desktop', name = "JPEGImportQuality" }, value = 100, default = "not set" },
]
