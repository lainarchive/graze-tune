[[tweak]]
id = "storage.trim"
module = "Storage"
title = "TRIM enabled"
why = "Without TRIM, SSD writes slow down over time and cause load stutter."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "DisableDeleteNotification" }, value = 0, default = 0 }]

[[tweak]]
id = "storage.last-access"
module = "Storage"
title = "Disable last-access timestamps"
why = "Skips a metadata write on every file read."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "NtfsDisableLastAccessUpdate" }, value = 2147483649, default = 2147483650 }]

[[tweak]]
id = "storage.8dot3"
module = "Storage"
title = "Disable 8.3 short names"
why = "Stops NTFS generating legacy short names for new files."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "NtfsDisable8dot3NameCreation" }, value = 1, default = 2 }]

[[tweak]]
id = "storage.disk-idle"
module = "Storage"
title = "Never spin down / idle the disk"
why = "Avoids link power wake-up hitches when a game streams assets."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "SUB_DISK", setting = "DISKIDLE" }, value = 0, default = 1200 }]

[[tweak]]
id = "storage.ahci-link-power"
module = "Storage"
title = "AHCI link power: active"
why = "Keeps the SATA link out of partial/slumber states."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "SUB_DISK", setting = "0b2d69d7-a2a1-449c-9680-f91c70521c60" }, value = 0, default = 3 }]

[[tweak]]
id = "storage.nvme-idle"
module = "Storage"
title = "NVMe: no idle power states on AC"
why = "Stops the NVMe drive dropping into low-power states after 200 ms idle, so the first read after a pause doesn't wait for it to wake. The drive runs a little warmer."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "0012ee47-9041-4b5d-9b77-535fba8b1442", setting = "d639518a-e56d-4345-8af2-b9f32fb26109" }, value = 0, default = 200 }]

[[tweak]]
id = "storage.hibernation"
module = "Storage"
title = "Turn off hibernation"
why = "Frees hiberfil.sys, which takes several GB of the system drive. Hibernate and Fast Startup stop working."
risk = "safe"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Power', name = "HibernateEnabled" }, value = 0, default = 1 }]

[[tweak]]
id = "storage.ntfs-memory"
module = "Storage"
title = "More memory for the NTFS cache"
why = "Raises the paged pool NTFS may use for its metadata cache, which helps games that open many small files. Uses a little more RAM."
risk = "safe"
restart = true
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "NtfsMemoryUsage" }, value = 2, default = "not set" },
]

[[tweak]]
id = "storage.folder-type-discovery"
module = "Storage"
title = "Stop Explorer guessing folder types"
why = "Explorer scans a folder's files to pick a music, photo or video layout, which makes big folders slow to open. Every folder uses the general layout instead."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell', name = "FolderType" }, value = "NotSpecified", default = "not set" },
]

[[tweak]]
id = "storage.small-crash-dumps"
module = "Storage"
title = "Small crash dumps only"
why = "After a blue screen Windows writes a small minidump instead of a kernel dump that can take several GB and a long reboot. The minidump still names the faulting driver."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\CrashControl', name = "CrashDumpEnabled" }, value = 3, default = 7 },
]
