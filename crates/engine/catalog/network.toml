[[tweak]]
id = "net.throttling-index"
module = "Network"
title = "Disable multimedia network throttling"
why = "Removes the 10 packets/ms cap MMCSS applies to non-multimedia traffic while audio plays."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', name = "NetworkThrottlingIndex" }, value = 0xFFFFFFFF, default = 10 }]

[[tweak]]
id = "net.nic-interrupt-moderation"
module = "Network"
title = "NIC interrupt moderation off"
why = "Delivers packets immediately instead of batching them. Slightly higher CPU use."
risk = "caution"
changes = [{ target = { kind = "device_registry", class = "net", subkey = "", name = "*InterruptModeration" }, value = "0", default = "1" }]

[[tweak]]
id = "net.nic-eee"
module = "Network"
title = "Disable Energy Efficient Ethernet"
why = "EEE puts the link to sleep between packets and adds wake latency."
risk = "safe"
changes = [{ target = { kind = "device_registry", class = "net", subkey = "", name = "*EEE" }, value = "0", default = "1" }]

[[tweak]]
id = "net.nic-flow-control"
module = "Network"
title = "Disable flow control"
why = "Stops pause frames from the switch stalling the receive path."
risk = "safe"
changes = [{ target = { kind = "device_registry", class = "net", subkey = "", name = "*FlowControl" }, value = "0", default = "3" }]

[[tweak]]
id = "net.qos-reserve"
module = "Network"
title = "Default QoS bandwidth reserve"
why = "'Free 20% bandwidth' tweaks are placebo: Windows only reserves bandwidth for apps that ask for it."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows\Psched', name = "NonBestEffortLimit" }, value = "not set", default = "not set" }]

[[tweak]]
id = "net.delivery-optimization"
module = "Network"
title = "No peer-to-peer update sharing"
why = "Delivery Optimization uploads Windows updates to other PCs, which eats upload bandwidth and raises ping. Updates still download from Microsoft."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization', name = "DODownloadMode" }, value = 0, default = "not set" }]

[[tweak]]
id = "net.smart-name-resolution"
module = "Network"
title = "Disable smart multi-homed name resolution"
why = "Windows otherwise sends each DNS query out every adapter at once, which can bypass a VPN or a chosen DNS server."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows NT\DNSClient', name = "DisableSmartNameResolution" }, value = 1, default = "not set" }]

[[tweak]]
id = "net.nic-lso"
module = "Network"
title = "Disable Large Send Offload"
why = "LSO batches outgoing data into big chunks for the adapter to split, which can delay small game packets behind bulk uploads. Costs a little CPU."
risk = "safe"
changes = [
  { target = { kind = "device_registry", class = "net", subkey = "", name = "*LsoV2IPv4" }, value = "0", default = "1" },
  { target = { kind = "device_registry", class = "net", subkey = "", name = "*LsoV2IPv6" }, value = "0", default = "1" },
]

[[tweak]]
id = "net.nic-power-saving"
module = "Network"
title = "Don't let Windows power off the adapter"
why = "Clears 'Allow the computer to turn off this device to save power', which can drop or slow the link after idle."
risk = "safe"
restart = true
changes = [{ target = { kind = "device_registry", class = "net", subkey = "", name = "PnPCapabilities" }, value = 24, default = "not set" }]

[[tweak]]
id = "net.nic-wake"
module = "Network"
title = "Ethernet: no wake on LAN"
why = "Stops network traffic waking the PC from sleep. Remote wake-up tools stop working."
risk = "safe"
changes = [
  { target = { kind = "device_registry", class = "net", subkey = "", name = "*WakeOnMagicPacket" }, value = "0", default = "1" },
  { target = { kind = "device_registry", class = "net", subkey = "", name = "*WakeOnPattern" }, value = "0", default = "1" },
]

[[tweak]]
id = "net.realtek-green"
module = "Network"
title = "Realtek Ethernet: power saving off"
why = "Turns off Green Ethernet, Power Saving Mode and GigaLite on Realtek adapters, which can drop the link speed or add wake-up delay. No effect on other brands."
risk = "safe"
changes = [
  { target = { kind = "device_registry", class = "net", subkey = "", name = "EnableGreenEthernet" }, value = "0", default = "1" },
  { target = { kind = "device_registry", class = "net", subkey = "", name = "PowerSavingMode" }, value = "0", default = "1" },
  { target = { kind = "device_registry", class = "net", subkey = "", name = "GigaLite" }, value = "0", default = "1" },
]

[[tweak]]
id = "net.dns-negative-cache"
module = "Network"
title = "Don't cache failed DNS lookups"
why = "After a network blip Windows remembers failed lookups for up to 15 minutes, so a game or launcher can't reconnect. Off retries at once."
risk = "safe"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Services\Dnscache\Parameters', name = "MaxNegativeCacheTtl" }, value = 0, default = "not set" }]

[[tweak]]
id = "net.llmnr"
module = "Network"
title = "Disable LLMNR name broadcasts"
why = "Stops Windows multicasting name lookups to the local network when DNS fails, which adds lookup delay and is a known spoofing target."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows NT\DNSClient', name = "EnableMulticast" }, value = 0, default = "not set" }]
