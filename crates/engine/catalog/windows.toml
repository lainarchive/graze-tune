[[tweak]]
id = "win.game-mode"
module = "Windows UI"
title = "Game Mode on"
why = "Game Mode stops Windows Update installs and driver installs while you play. Some optimizers turn it off."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\GameBar', name = "AutoGameModeEnabled" }, value = 1, default = "not set" }]

[[tweak]]
id = "win.game-dvr"
module = "Windows UI"
title = "Disable Game DVR background recording"
why = "Background recording encodes the last minutes of play continuously."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'System\GameConfigStore', name = "GameDVR_Enabled" }, value = 0, default = 1 },
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\GameDVR', name = "AppCaptureEnabled" }, value = 0, default = "not set" },
]

[[tweak]]
id = "win.transparency"
module = "Windows UI"
title = "Disable transparency effects"
why = "Less DWM blur work while alt-tabbed or using a borderless game."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name = "EnableTransparency" }, value = 0, default = 1 }]

[[tweak]]
id = "win.notifications"
module = "Windows UI"
title = "Silence toast notifications"
why = "Toasts can knock a fullscreen game out of independent flip."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\PushNotifications', name = "ToastEnabled" }, value = 0, default = "not set" }]

[[tweak]]
id = "win.menu-delay"
module = "Windows UI"
title = "Instant menus"
why = "Removes the 400 ms menu show delay."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Desktop', name = "MenuShowDelay" }, value = "0", default = "400" }]

[[tweak]]
id = "bg.telemetry"
module = "Background"
title = "Telemetry: required only"
why = "Lowers diagnostic data collection and the DiagTrack uploads that come with it."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowTelemetry" }, value = 1, default = "not set" }]

[[tweak]]
id = "bg.diagtrack"
module = "Background"
title = "Connected User Experiences on demand"
why = "DiagTrack wakes periodically to upload telemetry."
risk = "safe"
changes = [{ target = { kind = "service", name = "DiagTrack" }, value = 3, default = 2 }]

[[tweak]]
id = "bg.background-apps"
module = "Background"
title = "Block background Store apps"
why = "Stops Store apps running in the background."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications', name = "GlobalUserDisabled" }, value = 1, default = "not set" }]

[[tweak]]
id = "bg.compat-appraiser"
module = "Background"
title = "Disable compatibility appraiser task"
why = "Microsoft Compatibility Appraiser scans every program and spikes CPU for minutes."
risk = "safe"
changes = [{ target = { kind = "task", path = '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser' }, value = 0, default = 1 }]

[[tweak]]
id = "svc.wsearch-manual"
module = "Services"
title = "Windows Search on demand"
why = "The indexer competes for disk and CPU after installs and patches. Start menu search still works, only slower."
risk = "caution"
changes = [{ target = { kind = "service", name = "WSearch" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.xbox-manual"
module = "Services"
title = "Xbox services on demand"
why = "Starts Xbox Live services only when an Xbox app asks for them."
risk = "safe"
changes = [
  { target = { kind = "service", name = "XblAuthManager" }, value = 3, default = 3 },
  { target = { kind = "service", name = "XboxNetApiSvc" }, value = 3, default = 3 },
]

[[tweak]]
id = "svc.wuauserv-default"
module = "Services"
title = "Windows Update on (manual trigger)"
why = "Disabling Windows Update breaks driver and security updates; Game Mode already pauses installs while you play."
risk = "safe"
changes = [{ target = { kind = "service", name = "wuauserv" }, value = 3, default = 3 }]

[[tweak]]
id = "reg.startup-delay"
module = "Registry"
title = "No startup app delay"
why = "Removes Explorer's artificial delay before starting startup apps."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize', name = "StartupDelayInMSec" }, value = 0, default = "not set" }]

[[tweak]]
id = "reg.auto-end-tasks"
module = "Registry"
title = "Fast shutdown of hung apps"
why = "Closes apps that hang at shutdown instead of waiting."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Desktop', name = "AutoEndTasks" }, value = "1", default = "not set" }]

[[tweak]]
id = "win.visual-effects"
module = "Windows UI"
title = "Cut taskbar and desktop animations"
why = "Turns off taskbar animations, icon label shadows and Aero Peek, so DWM has less to draw over a borderless game."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "TaskbarAnimations" }, value = 0, default = "not set" },
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "ListviewShadow" }, value = 0, default = "not set" },
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\DWM', name = "EnableAeroPeek" }, value = 0, default = "not set" },
]

[[tweak]]
id = "win.start-web-search"
module = "Windows UI"
title = "Local-only Start search"
why = "Start search stops sending every keystroke to Bing and shows only apps, files and settings, which also makes it faster."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Policies\Microsoft\Windows\Explorer', name = "DisableSearchBoxSuggestions" }, value = 1, default = "not set" },
  { target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Search', name = "BingSearchEnabled" }, value = 0, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', name = "ConnectedSearchUseWeb" }, value = 0, default = "not set" },
]

[[tweak]]
id = "win.start-recommendations"
module = "Windows UI"
title = "No promoted items in Start"
why = "Hides app and tip promotions from the Recommended section of Start."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "Start_IrisRecommendations" }, value = 0, default = "not set" }]

[[tweak]]
id = "win.widgets"
module = "Windows UI"
title = "Turn off Widgets"
why = "The Widgets board keeps a WebView process alive and refreshes news and weather in the background."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Dsh', name = "AllowNewsAndInterests" }, value = 0, default = "not set" }]

[[tweak]]
id = "win.end-task"
module = "Windows UI"
title = "End task in the taskbar menu"
why = "Adds End task to a taskbar button's right-click menu, so a frozen game can be killed without Task Manager."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings', name = "TaskbarEndTask" }, value = 1, default = "not set" }]

[[tweak]]
id = "bg.ceip-tasks"
module = "Background"
title = "Disable Customer Experience tasks"
why = "The CEIP consolidator and USB reporting tasks collect and upload usage data on a schedule."
risk = "safe"
changes = [
  { target = { kind = "task", path = '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator' }, value = 0, default = 1 },
  { target = { kind = "task", path = '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip' }, value = 0, default = 1 },
]

[[tweak]]
id = "bg.app-experience-tasks"
module = "Background"
title = "Disable app compatibility scan tasks"
why = "PcaPatchDbTask, MareBackup and StartupAppTask scan installed programs in the background and can spike disk and CPU."
risk = "safe"
changes = [
  { target = { kind = "task", path = '\Microsoft\Windows\Application Experience\PcaPatchDbTask' }, value = 0, default = 1 },
  { target = { kind = "task", path = '\Microsoft\Windows\Application Experience\MareBackup' }, value = 0, default = 1 },
  { target = { kind = "task", path = '\Microsoft\Windows\Application Experience\StartupAppTask' }, value = 0, default = 1 },
]

[[tweak]]
id = "bg.feedback-tasks"
module = "Background"
title = "Disable feedback data tasks"
why = "The Feedback Hub DmClient tasks gather diagnostics for feedback scenarios on a timer."
risk = "safe"
changes = [
  { target = { kind = "task", path = '\Microsoft\Windows\Feedback\Siuf\DmClient' }, value = 0, default = 1 },
  { target = { kind = "task", path = '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload' }, value = 0, default = 1 },
]

[[tweak]]
id = "bg.error-reporting"
module = "Background"
title = "Turn off Windows Error Reporting"
why = "Crashes are no longer packaged and uploaded, which can take seconds of disk and CPU after a game crash. Crash dumps for your own debugging are lost too."
risk = "caution"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows\Windows Error Reporting', name = "Disabled" }, value = 1, default = "not set" },
  { target = { kind = "task", path = '\Microsoft\Windows\Windows Error Reporting\QueueReporting' }, value = 0, default = 1 },
]

[[tweak]]
id = "bg.disk-diagnostic"
module = "Background"
title = "Disable disk diagnostic data collector"
why = "Stops the scheduled task that gathers disk health data for Microsoft. SMART warnings still show."
risk = "safe"
changes = [{ target = { kind = "task", path = '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector' }, value = 0, default = 1 }]

[[tweak]]
id = "bg.autologgers"
module = "Background"
title = "Stop diagnostic trace sessions at boot"
why = "These ETW trace sessions log telemetry and diagnostics from boot onward. Network and diagnostic troubleshooters lose their history."
risk = "caution"
restart = true
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\WMI\Autologger\Diagtrack-Listener', name = "Start" }, value = 0, default = 1 },
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\WMI\Autologger\SQMLogger', name = "Start" }, value = 0, default = 1 },
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\WMI\Autologger\DiagLog', name = "Start" }, value = 0, default = 1 },
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\WMI\Autologger\WdiContextLog', name = "Start" }, value = 0, default = 1 },
]

[[tweak]]
id = "bg.dmwappush"
module = "Background"
title = "Disable WAP push message routing"
why = "dmwappushservice only routes device-management push messages, which a home PC never gets. Leave it on if work or school manages this PC."
risk = "caution"
changes = [{ target = { kind = "service", name = "dmwappushservice" }, value = 4, default = 3 }]

[[tweak]]
id = "svc.maps-broker"
module = "Services"
title = "Downloaded Maps Manager on demand"
why = "Only the Maps app needs it."
risk = "safe"
changes = [{ target = { kind = "service", name = "MapsBroker" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.trkwks"
module = "Services"
title = "Distributed Link Tracking on demand"
why = "Tracks shortcuts to files that move between NTFS volumes on a network domain; a home PC has no use for it running all the time."
risk = "safe"
changes = [{ target = { kind = "service", name = "TrkWks" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.pcasvc"
module = "Services"
title = "Program Compatibility Assistant on demand"
why = "Watches every program you start for compatibility problems."
risk = "safe"
changes = [{ target = { kind = "service", name = "PcaSvc" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.cdp"
module = "Services"
title = "Connected Devices Platform on demand"
why = "Runs Phone Link, Nearby sharing and cross-device sync. Starts when those features ask, so they can feel slower to connect."
risk = "caution"
changes = [{ target = { kind = "service", name = "CDPSvc" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.spooler"
module = "Services"
title = "Print Spooler on demand"
why = "Saves a background service on PCs that never print. If printing stops working, turn this back off."
risk = "caution"
changes = [{ target = { kind = "service", name = "Spooler" }, value = 3, default = 2 }]

[[tweak]]
id = "svc.alljoyn"
module = "Services"
title = "Disable AllJoyn Router"
why = "AllJoyn is a retired smart-home protocol."
risk = "safe"
changes = [{ target = { kind = "service", name = "AJRouter" }, value = 4, default = 3 }]

[[tweak]]
id = "svc.retail-demo"
module = "Services"
title = "Disable Retail Demo"
why = "Only used by store display PCs."
risk = "safe"
changes = [{ target = { kind = "service", name = "RetailDemo" }, value = 4, default = 3 }]

[[tweak]]
id = "svc.fax"
module = "Services"
title = "Disable Fax"
why = "Nobody on a gaming PC sends faxes."
risk = "safe"
changes = [{ target = { kind = "service", name = "Fax" }, value = 4, default = 3 }]

[[tweak]]
id = "reg.fast-startup"
module = "Registry"
title = "Disable Fast Startup"
why = "Fast Startup resumes the kernel and drivers from a hibernation file, so driver and timer changes only take effect after a real restart. Off gives a clean start every boot."
risk = "safe"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Power', name = "HiberbootEnabled" }, value = 0, default = 1 }]

[[tweak]]
id = "win.hover-delay"
module = "Windows UI"
title = "Instant hover tooltips and previews"
why = "Cuts the hover delay before taskbar previews and tooltips from 400 ms to 10 ms. Takes effect after signing out."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Mouse', name = "MouseHoverTime" }, value = "10", default = "400" }]

[[tweak]]
id = "reg.hung-app-timeout"
module = "Registry"
title = "Shorter waits on hung apps and shutdown"
why = "Windows waits 2 seconds instead of 5 to 20 before treating an app or service as hung, so a frozen game or a shutdown clears faster."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Desktop', name = "HungAppTimeout" }, value = "2000", default = "not set" },
  { target = { kind = "registry", hive = "HKCU", path = 'Control Panel\Desktop', name = "WaitToKillAppTimeout" }, value = "2000", default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control', name = "WaitToKillServiceTimeout" }, value = "2000", default = "5000" },
]
