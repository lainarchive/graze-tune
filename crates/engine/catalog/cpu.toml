[[tweak]]
id = "cpu.priority-separation"
module = "CPU & scheduler"
title = "Foreground priority boost"
why = "Short, variable quanta with a 3:1 foreground boost so the game thread gets CPU back sooner."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\PriorityControl', name = "Win32PrioritySeparation" }, value = 38, default = 2 }]

[[tweak]]
id = "cpu.core-parking"
module = "CPU & scheduler"
title = "Disable core parking"
why = "Keeps every core unparked so the game thread never waits on a core wake-up."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "CPMINCORES" }, value = 100, default = 10 }]

[[tweak]]
id = "cpu.min-state"
module = "CPU & scheduler"
title = "Minimum processor state 100%"
why = "Stops clocks dropping between frames. Costs idle power and heat."
risk = "caution"
changes = [{ target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "PROCTHROTTLEMIN" }, value = 100, default = 5 }]

[[tweak]]
id = "cpu.boost-aggressive"
module = "CPU & scheduler"
title = "Turbo boost: aggressive"
why = "Makes sure turbo is enabled and ramps quickly. Some optimizers turn it off, which costs a lot of fps on a 4-core CPU."
risk = "safe"
changes = [{ target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "PERFBOOSTMODE" }, value = 2, default = 2 }]

[[tweak]]
id = "cpu.idle-promote"
module = "CPU & scheduler"
title = "Shallow C-states during play"
why = "Biases the CPU towards shallow idle states to cut wake-up latency."
risk = "caution"
changes = [
  { target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "IDLEPROMOTE" }, value = 100, default = 40 },
  { target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "IDLEDEMOTE" }, value = 100, default = 20 },
]

[[tweak]]
id = "cpu.idle-disable"
module = "CPU & scheduler"
title = "Disable processor idle"
why = "Keeps cores spinning instead of idling. Large heat and power cost; only helps on some systems."
risk = "caution"
changes = [{ target = { kind = "power", subgroup = "SUB_PROCESSOR", setting = "IDLEDISABLE" }, value = 1, default = 0 }]

[[tweak]]
id = "cpu.games-priority"
module = "CPU & scheduler"
title = "Multimedia scheduler: games task"
why = "Gives the MMCSS 'Games' task high scheduling and GPU priority."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', name = "GPU Priority" }, value = 8, default = 8 },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', name = "Priority" }, value = 6, default = 2 },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', name = "Scheduling Category" }, value = "High", default = "Medium" },
]

[[tweak]]
id = "cpu.system-responsiveness"
module = "CPU & scheduler"
title = "MMCSS system responsiveness 10%"
why = "Reserves less CPU for background tasks while multimedia work runs. 0 is clamped to 20 by Windows, so 10 is the real minimum."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', name = "SystemResponsiveness" }, value = 10, default = 20 }]

[[tweak]]
id = "cpu.power-throttling"
module = "CPU & scheduler"
title = "Disable power throttling"
why = "Stops Windows putting background processes (voice chat, overlays) on efficiency scheduling."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Power\PowerThrottling', name = "PowerThrottlingOff" }, value = 1, default = "not set" }]

[[tweak]]
id = "cpu.games-io-priority"
module = "CPU & scheduler"
title = "Multimedia scheduler: games I/O priority"
why = "Gives disk reads from MMCSS 'Games' threads high I/O priority."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', name = "SFIO Priority" }, value = "High", default = "Normal" }]

[[tweak]]
id = "cpu.mmcss-no-lazy"
module = "CPU & scheduler"
title = "Multimedia scheduler: no idle detection"
why = "Undocumented MMCSS values that keep its scheduling boost active instead of waiting for idle periods. Results vary by PC; benchmark before keeping."
risk = "caution"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', name = "NoLazyMode" }, value = 1, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', name = "AlwaysOn" }, value = 1, default = "not set" },
]

[[tweak]]
id = "cpu.fault-tolerant-heap"
module = "CPU & scheduler"
title = "Disable Fault Tolerant Heap"
why = "After a program crashes a few times, Windows can silently attach a slower crash-proof heap to it. Off keeps games on the normal heap."
risk = "safe"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\FTH', name = "Enabled" }, value = 0, default = 1 }]

[[tweak]]
id = "cpu.low-priority-indexer"
module = "CPU & scheduler"
title = "Search indexer at low CPU and disk priority"
why = "SearchIndexer.exe starts at below-normal CPU and low I/O priority, so indexing yields to the game instead of competing with it."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\SearchIndexer.exe\PerfOptions', name = "CpuPriorityClass" }, value = 5, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\SearchIndexer.exe\PerfOptions', name = "IoPriority" }, value = 1, default = "not set" },
]

[[tweak]]
id = "cpu.low-priority-compat-telemetry"
module = "CPU & scheduler"
title = "Compatibility telemetry at idle priority"
why = "CompatTelRunner.exe can pin a core and hammer the disk for minutes. Idle CPU and very low I/O priority keep it out of the way."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe\PerfOptions', name = "CpuPriorityClass" }, value = 1, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe\PerfOptions', name = "IoPriority" }, value = 0, default = "not set" },
]
