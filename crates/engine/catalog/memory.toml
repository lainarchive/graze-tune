[[tweak]]
id = "mem.large-system-cache"
module = "Memory"
title = "Workstation file cache"
why = "LargeSystemCache=1 is a server setting that starves games of working set."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', name = "LargeSystemCache" }, value = 0, default = 0 }]

[[tweak]]
id = "mem.paging-executive"
module = "Memory"
title = "Keep kernel in RAM"
why = "DisablePagingExecutive keeps drivers and kernel code resident. Safe with 16 GB."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', name = "DisablePagingExecutive" }, value = 1, default = 0 }]

[[tweak]]
id = "mem.sysmain-manual"
module = "Memory"
title = "SysMain on demand"
why = "Superfetch prefetching causes disk and CPU bursts on 4-thread CPUs. Manual start keeps it available."
risk = "safe"
changes = [{ target = { kind = "service", name = "SysMain" }, value = 3, default = 2 }]

[[tweak]]
id = "mem.prefetcher"
module = "Memory"
title = "Disable boot and app prefetcher"
why = "Avoids prefetch reads competing with game asset streaming on SATA SSDs."
risk = "safe"
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters', name = "EnablePrefetcher" }, value = 0, default = 3 }]

[[tweak]]
id = "mem.ndu"
module = "Memory"
title = "Disable network data usage monitor"
why = "The Ndu driver counts traffic per app and is a known source of non-paged pool leaks on some network drivers. Settings stops showing data usage per app."
risk = "caution"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Services\Ndu', name = "Start" }, value = 4, default = 2 }]

[[tweak]]
id = "mem.page-combining"
module = "Memory"
title = "Disable memory page combining"
why = "Windows periodically scans RAM for identical pages to merge, which costs CPU time. With enough RAM the saving is not worth the scans."
risk = "safe"
restart = true
changes = [{ target = { kind = "registry", hive = "HKLM", path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', name = "DisablePagingCombining" }, value = 1, default = "not set" }]

[[tweak]]
id = "mem.edge-background"
module = "Memory"
title = "Keep Edge closed when it's closed"
why = "Edge preloads at sign-in, prerenders the new tab page and keeps running after its window closes, holding hundreds of MB. Off by policy; Edge opens a little slower."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Edge', name = "StartupBoostEnabled" }, value = 0, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Edge', name = "BackgroundModeEnabled" }, value = 0, default = "not set" },
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Microsoft\Edge', name = "NewTabPagePrerenderEnabled" }, value = 0, default = "not set" },
]

[[tweak]]
id = "mem.chrome-background"
module = "Memory"
title = "Keep Chrome closed when it's closed"
why = "Chrome keeps running in the tray after its last window closes so extensions and apps can run. Off by policy frees that memory."
risk = "safe"
changes = [
  { target = { kind = "registry", hive = "HKLM", path = 'SOFTWARE\Policies\Google\Chrome', name = "BackgroundModeEnabled" }, value = 0, default = "not set" },
]
